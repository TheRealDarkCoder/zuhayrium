# Builds the site with Eleventy and deploys _site/ to the Cloudflare Pages project "zuhayrium".
# Only pushes to main deploy, and they update production (zuhayrium.com). Other branches are
# never deployed, because Pages preview sites are public. Needs the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
    branches: [main]

# A newer push replaces a deployment that is still running.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs because the deploy step receives the Cloudflare token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.157.0"
          command: pages deploy _site --project-name=zuhayrium --branch=main
